[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seq2seq"
version = "0.1.0"
description = "Pedagogical replica of Sutskever et al. 2014 Sequence to Sequence Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "datasets>=2.16",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
seq2seq-train = "seq2seq.train:main"
seq2seq-decode = "seq2seq.decode:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
